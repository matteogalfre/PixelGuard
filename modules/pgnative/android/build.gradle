plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pgnative'
version = '0.1.0'

android {
  namespace "expo.modules.pgnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Client SMB 2/3 en Java pur (Apache-2.0).
  implementation 'com.hierynomus:smbj:0.15.0'
  // Lecture du QR affiché par le PC (Apache-2.0) : ZXing, sans services Google ni envoi de
  // statistiques (expo-camera passe par ML Kit sur Android, qui en envoie).
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
