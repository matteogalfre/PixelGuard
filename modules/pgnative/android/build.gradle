plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pgnative'
version = '0.1.0'

android {
  namespace "expo.modules.pgnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Client SMB 2/3 en Java pur (Apache-2.0).
  implementation 'com.hierynomus:smbj:0.15.0'
}
